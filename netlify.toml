[build]
  command = "npm run build"
  publish = "dist"

# Redirección explícita a la función para /api/redgifs/*
[[redirects]]
  from = "/api/redgifs/*"
  to = "/.netlify/functions/redgifs/:splat"
  status = 200

# Redirigir el resto de rutas al index.html para React SPA
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
