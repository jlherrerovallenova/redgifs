<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181326"/>
      <stop offset="50%" stop-color="#0e0c14"/>
      <stop offset="100%" stop-color="#090a0f"/>
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fondo redondeado con borde sutil -->
  <rect width="192" height="192" rx="42" fill="url(#bgGrad)" />
  <rect width="188" height="188" x="2" y="2" rx="40" fill="none" stroke="url(#neonGrad)" stroke-width="3" stroke-opacity="0.5" />

  <!-- Círculo interior con resplandor -->
  <circle cx="96" cy="96" r="62" fill="url(#neonGrad)" fill-opacity="0.12" />

  <!-- Símbolo de Play y Flecha de Descarga integrada -->
  <g filter="url(#glow)">
    <!-- Polígono de reproducción moderno -->
    <path d="M78 62 L128 96 L78 130 Z" fill="url(#neonGrad)" />
    <!-- Flecha descendente inferior -->
    <path d="M82 142 L96 156 L110 142" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.95" />
    <line x1="96" y1="126" x2="96" y2="154" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" opacity="0.95" />
  </g>
</svg>
