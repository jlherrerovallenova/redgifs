<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181326"/>
      <stop offset="100%" stop-color="#090a0f"/>
    </linearGradient>
    <linearGradient id="neonMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <!-- Fondo completo para zona segura (maskable) -->
  <rect width="512" height="512" fill="url(#bgMask)" />
  <circle cx="256" cy="256" r="140" fill="url(#neonMask)" fill-opacity="0.15" />

  <!-- Símbolo centrado en zona segura (inner 80%) -->
  <g>
    <path d="M216 172 L332 256 L216 340 Z" fill="url(#neonMask)" />
    <path d="M224 375 L256 407 L288 375" fill="none" stroke="#ffffff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="256" y1="335" x2="256" y2="403" stroke="#ffffff" stroke-width="11" stroke-linecap="round" />
  </g>
</svg>
